# Admin portal CI/CD. Typecheck + build with placeholder Clerk keys on every push/PR; a green
# dev push deploys to Fly lince-admin-dev (private-only, published via the Cloudflare tunnel as
# admin-dev.lincefinance.xyz behind Access). Requires the FLY_API_TOKEN repo secret
# (fly tokens create deploy -a lince-admin-dev) and ADMIN_CLERK_SECRET_KEY on the backend so
# the deployed admin runs verified staff identity, not legacy body-trust.
name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_dummy
      LINCE_API_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build

  deploy-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy-dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
